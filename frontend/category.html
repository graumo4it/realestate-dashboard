<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Раздел — Рынок недвижимости России</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/chart.css"/>
  <style>
    .indicator-list { display: flex; flex-direction: column; gap: 0; }
    .indicator-row {
      display: grid;
      grid-template-columns: 1fr 140px 80px 100px;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      transition: background .15s;
    }
    .indicator-row:first-child { border-radius: 0; }  /* wrapper обрезает углы */
    .indicator-row:last-child  { border-bottom: none; }

    /* Заголовок подраздела */
    .section-header {
      padding: 8px 20px 7px;
      background: var(--color-bg);
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--color-muted);
      border-bottom: 1px solid var(--color-border);
    }
    .section-header:not(:first-child) {
      border-top: 2px solid var(--color-border);
    }
    .indicator-row:hover { background: #fafbfc; }
    .indicator-row-wrap {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .indicator-name { font-size: .9rem; font-weight: 500; }
    .indicator-name a { color: var(--color-ink); }
    .indicator-name a:hover { color: var(--color-accent); }
    .indicator-value { font-family: var(--font-mono); font-size: 1rem; font-weight: 600; text-align: right; }
    .indicator-period { font-size: .72rem; color: var(--color-muted); text-align: right; }
    .indicator-sparkline { display: flex; justify-content: center; }
    .list-header {
      display: grid;
      grid-template-columns: 1fr 140px 80px 100px;
      gap: 16px;
      padding: 10px 20px;
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--color-muted);
      border-bottom: 2px solid var(--color-border);
      background: var(--color-bg);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .page-content { flex: 1; }
    .page-heading { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .page-heading-sub { font-size: .9rem; color: var(--color-muted); margin-bottom: 32px; }

    /* Комбо-карточки */
    .combo-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .72rem;
      font-weight: 600;
      color: var(--color-accent);
      background: #fff6f5;
      border: 1px solid #fcd9d5;
      border-radius: 4px;
      padding: 2px 8px;
    }
    .combo-value {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: var(--color-muted);
      font-size: .82rem;
    }
    .combo-icon {
      flex-shrink: 0;
      opacity: .5;
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo">Рынок<span>.</span>Данные</a>
    <nav class="header-nav" id="main-nav">
      <a href="category.html?code=mortgage_base">Ипотека</a>
      <a href="category.html?code=prices">Цены</a>
      <a href="category.html?code=demand">Спрос</a>
      <a href="category.html?code=supply_volume">Ввод жилья</a>
      <a href="category.html?code=under_construction">Стройка</a>
      <a href="category.html?code=macro">Макро</a>
    </nav>
    <div class="header-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="search-input" type="text" placeholder="Поиск показателей…"/>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="page-wrap">
    <div class="chart-layout">

      <!-- Sidebar навигация -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-heading">Разделы</div>
        <div id="sidebar-links"></div>
      </aside>

      <!-- Content -->
      <div class="page-content">
        <div class="breadcrumb">
          <a href="index.html">Главная</a>
          <span class="breadcrumb-sep">›</span>
          <span id="cat-name">Загрузка…</span>
        </div>
        <h1 class="page-heading" id="page-heading">Загрузка…</h1>
        <p class="page-heading-sub" id="page-sub"></p>

        <div class="list-header">
          <div>Показатель</div>
          <div style="text-align:right">Последнее значение</div>
          <div style="text-align:center">Изм. г/г</div>
          <div style="text-align:center">Динамика</div>
        </div>
        <div class="indicator-list indicator-row-wrap" id="indicator-list">
          <div class="skeleton" style="height:52px;margin:8px 16px;border-radius:6px"></div>
          <div class="skeleton" style="height:52px;margin:8px 16px;border-radius:6px"></div>
          <div class="skeleton" style="height:52px;margin:8px 16px;border-radius:6px"></div>
          <div class="skeleton" style="height:52px;margin:8px 16px;border-radius:6px"></div>
          <div class="skeleton" style="height:52px;margin:8px 16px;border-radius:6px"></div>
          <div class="skeleton" style="height:52px;margin:8px 16px;border-radius:6px"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div>Данные: Банк России, Росстат, ДОМ.РФ, Домклик, Росреестр, ЕМИСС</div>
</footer>

<script>window.API_BASE = 'http://localhost:8001/api';</script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/sparkline.js"></script>
<script src="js/category-overrides.js"></script>
<script>

// ── SUBSECTIONS ───────────────────────────────────────────────────────────────
// Определяет подразделы для конкретных категорий.
// Если для catCode есть запись — рендер идёт по подразделам, иначе — плоский список.
//
// Коды в `codes[]`:
//   • обычная карточка / parentCode-комбо → ind.code
//   • append-комбо (parentCode=null)       → ind._comboUrl (URL страницы)
const SUBSECTIONS = {
  demand: [
    { label: 'Общее',               codes: ['5.1', '5.3'] },
    { label: 'Квартиры',            codes: ['5.8', '5.9', 'apt_area'] },
    { label: 'Машиноместа',         codes: ['5.20', '5.22', '5.21'] },
    { label: 'Доступность жилья',   codes: ['5.10', '5.11'] },
    { label: 'Уровень потребности', codes: [
      'housing-need-chart.html',
      'housing-pace-chart.html',
      'housing-need-real-chart.html',
      'housing-pace-real-chart.html',
    ]},
  ],
  prices: [
    { label: 'Квартиры',    codes: ['4.4', '4.1', 'apt_budget'] },
    { label: 'Машиноместа', codes: ['4.8', '4.9'] },
  ],
  mortgage_subsidy: [
    { label: 'Объёмы выдач',            codes: ['6.36', 'subsidy-volume.html'] },
    { label: 'Характеристики кредитов', codes: [
      'subsidy-rate.html',
      'subsidy-term.html',
      'subsidy-loan-amount.html',
      'subsidy-ltv.html',
      'subsidy-property-price.html',
      'subsidy-area.html',
      'subsidy-price-per-sqm.html',
    ]},
    { label: 'Структура выдач',         codes: [
      'subsidy-purpose-structure.html',
      'subsidy-family-types.html',
    ]},
  ],
};

// ── Иконка для комбо-карточек ──────────────────────────────────────────────
const COMBO_ICON_SVG = `<svg class="combo-icon" width="16" height="16" viewBox="0 0 24 24"
  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
  <line x1="8" y1="6" x2="16" y2="6" opacity=".4"/>
</svg>`;

// ── Основная логика страницы ───────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const catCode = params.get('code') || 'mortgage_total';

async function loadPage() {
  const HIDDEN_CATEGORIES = ['mortgage_total', 'mortgage_secondary'];
const categories = (await api.categories()).filter(c => !HIDDEN_CATEGORIES.includes(c.code));

  // Заголовочная навигация
  const nav = document.getElementById('main-nav');
  nav.innerHTML = `
    <a href="category.html?code=mortgage_base" ${catCode==='mortgage_base'?'class="active"':''}>Ипотека</a>
    <a href="category.html?code=prices" ${catCode==='prices'?'class="active"':''}>Цены</a>
    <a href="category.html?code=demand" ${catCode==='demand'?'class="active"':''}>Спрос</a>
    <a href="category.html?code=supply_volume" ${catCode==='supply_volume'?'class="active"':''}>Ввод жилья</a>
    <a href="category.html?code=under_construction" ${catCode==='under_construction'?'class="active"':''}>Стройка</a>
    <a href="category.html?code=macro" ${catCode==='macro'?'class="active"':''}>Макро</a>
  `;

  // Боковая панель
  const sidebarLinks = document.getElementById('sidebar-links');
  sidebarLinks.innerHTML = categories.map(c =>
    `<a href="category.html?code=${c.code}" class="sidebar-link ${c.code === catCode ? 'active' : ''}">${c.name}</a>`
  ).join('');

  // Индикаторы категории
  const rawIndicators = await api.categoryIndicators(catCode);
  const indicators    = applyComboOverrides(catCode, rawIndicators);
  const cat = categories.find(c => c.code === catCode);

  document.title = `${cat?.name || catCode} — Рынок недвижимости`;
  document.getElementById('cat-name').textContent    = cat?.name || catCode;
  document.getElementById('page-heading').textContent = cat?.name || catCode;
  document.getElementById('page-sub').textContent =
    `${indicators.length} показателей`;

  const list = document.getElementById('indicator-list');
  list.innerHTML = '';

  // ── Рендер одной строки индикатора ─────────────────────────────────────────
  function renderRow(ind) {
    const isCombo = !!(ind._comboUrl);
    const href    = isCombo ? ind._comboUrl : `chart.html?code=${ind.code}`;
    const name    = isCombo ? ind._comboLabel : cleanName(ind.name);
    const pp      = ind.unit === '%';

    const row     = document.createElement('div');
    row.className = 'indicator-row';

    const sparkEl = document.createElement('div');
    sparkEl.className = 'indicator-sparkline';

    if (isCombo) {
      row.innerHTML = `
        <div class="indicator-name">
          <a href="${href}">${name}</a>
        </div>
        <div>
          <div class="combo-value">
            ${COMBO_ICON_SVG}
            <span style="font-size:.82rem;color:var(--color-muted)">Сравнительный&nbsp;анализ</span>
          </div>
        </div>
        <div style="text-align:center">
          <span class="combo-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            комбо
          </span>
        </div>
      `;
      row.appendChild(sparkEl);
      if (ind._sparkCode) {
        ((sparkCode, periodicity) => {
          (async () => {
            try {
              const years = periodicity === 'annual' ? 10 : 2;
              const data = await api.indicatorData(sparkCode, rangeStart(years));
              const vals = data.series.map(p => p.value);
              drawSparkline(sparkEl, vals, { width: 100, height: 36, color: '#E8341C' });
            } catch (_) {}
          })();
        })(ind._sparkCode, ind._sparkPeriodicity || 'annual');
      }
    } else {
      row.innerHTML = `
        <div class="indicator-name">
          <a href="${href}">${name}</a>
        </div>
        <div>
          <div class="indicator-value">${ind.last_value != null ? fmtValue(ind.last_value) : '—'}</div>
          <div class="indicator-period">${ind.last_period_label || ''} ${ind.unit ? '· ' + ind.unit : ''}</div>
        </div>
        <div style="text-align:center">${deltaHtml(ind.yoy_change_pct, pp)}</div>
      `;
      row.appendChild(sparkEl);
      ((code, periodicity) => {
        (async () => {
          try {
            const years = periodicity === 'annual' ? 10 : 2;
            let data = await api.indicatorData(code, rangeStart(years));
            if (data.series.filter(p => p.value != null).length < 2) {
              data = await api.indicatorData(code, null);
            }
            const vals = data.series.map(p => p.value);
            drawSparkline(sparkEl, vals, { width: 100, height: 36, color: '#E8341C' });
          } catch (_) {}
        })();
      })(ind.code, ind.periodicity);
    }
    return row;
  }

  // ── Рендер списка: с подразделами или плоский ──────────────────────────────
  const subs = SUBSECTIONS[catCode];
  if (subs) {
    // Lookup: effectiveCode → ind
    // append-комбо (parentCode=null) идентифицируются по _comboUrl
    const byCode = {};
    for (const ind of indicators) {
      const key = ind._isComboOnly ? ind._comboUrl : ind.code;
      byCode[key] = ind;
    }
    for (const sub of subs) {
      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = sub.label;
      list.appendChild(header);
      for (const code of sub.codes) {
        const ind = byCode[code];
        if (ind) list.appendChild(renderRow(ind));
      }
    }
  } else {
    // Плоский рендер для категорий без подразделов
    for (const ind of indicators) {
      list.appendChild(renderRow(ind));
    }
  }
}

loadPage().catch(console.error);
</script>
</body>
</html>

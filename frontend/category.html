  <link rel="stylesheet" href="css/main.css"/>

  <style>
    .indicator-list { display: flex; flex-direction: column; gap: 0; }
    .indicator-row {
      display: grid;
      grid-template-columns: 1fr 160px 80px 100px 90px;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      transition: background .15s;
    }
    .indicator-row:first-child { border-radius: 0; }  /* wrapper обрезает углы */
    .indicator-row:last-child  { border-bottom: none; }

    /* Заголовок подраздела */
    .section-header {
      padding: 8px 20px 7px;
      background: var(--color-bg);
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--color-muted);
      border-bottom: 1px solid var(--color-border);
    }
    .section-header:not(:first-child) {
      border-top: 2px solid var(--color-border);
    }
    .indicator-row:hover { background: #fafbfc; }
    .indicator-row-wrap {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .indicator-name { font-size: .9rem; font-weight: 500; }
    .indicator-name a { color: var(--color-ink); }
    .indicator-name a:hover { color: var(--color-accent); }
    .indicator-value { font-family: var(--font-mono); font-size: 1rem; font-weight: 600; text-align: right; }
    .indicator-period { font-size: .72rem; color: var(--color-muted); text-align: right; }
    .indicator-sparkline { display: flex; justify-content: center; }
    .list-header {
      display: grid;
      grid-template-columns: 1fr 160px 80px 100px 90px;
      gap: 16px;
      padding: 10px 20px;
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--color-muted);
      border-bottom: 2px solid var(--color-border);
      background: var(--color-bg);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .page-content { flex: 1; }
    .page-heading { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .page-heading-sub { font-size: .9rem; color: var(--color-muted); margin-bottom: 32px; }

    /* Комбо-карточки (для строк без серий — структурные/долевые) */
    .combo-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .72rem;
      font-weight: 600;
      color: var(--color-accent);
      background: #fff6f5;
      border: 1px solid #fcd9d5;
      border-radius: 4px;
      padding: 2px 8px;
    }
    .combo-value {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      color: var(--color-muted);
      font-size: .82rem;
    }
    .combo-icon {
      flex-shrink: 0;
      opacity: .5;
    }

    /* Серии с цикличным переключением */
    .series-label {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 2px;
    }
    .series-name {
      font-size: .7rem;
      color: var(--color-muted);
      font-weight: 500;
    }
    .series-dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .series-dots .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color-border, #ddd);
      transition: background .15s;
    }
    .series-dots .dot.active {
      background: var(--color-accent);
    }
    /* Строки с сериями — кликабельны (кроме ссылки-названия) */
    .indicator-row[data-has-series="true"] {
      cursor: pointer;
    }
    /* Плавный переход при смене значений */
    [data-field="value"], [data-field="yoy"], [data-field="spark"] {
      transition: opacity 0.15s;
    }
    .field-fading {
      opacity: 0;
    }
  </style>
</head>

<script>

// ── SUBSECTIONS ───────────────────────────────────────────────────────────────
// Определяет подразделы для конкретных категорий.
// Если для catCode есть запись — рендер идёт по подразделам, иначе — плоский список.
//
// Коды в `codes[]`:
//   • обычная карточка / parentCode-комбо → ind.code
//   • append-комбо (parentCode=null)       → ind._comboUrl (URL страницы)
const SUBSECTIONS = {
  demand: [
    { label: 'Общее',               codes: ['5.1', '5.3'] },
    { label: 'Квартиры',            codes: ['5.8', '5.9', 'apt_area'] },
    { label: 'Машиноместа',         codes: ['5.20', '5.22', '5.21'] },
    { label: 'Доступность жилья',   codes: ['5.10', '5.11'] },
    { label: 'Уровень потребности', codes: [
      'housing-need-chart.html',
      'housing-pace-chart.html',
      'housing-need-real-chart.html',
      'housing-pace-real-chart.html',
    ]},
  ],
  prices: [
    { label: 'Квартиры',    codes: ['4.4', '4.1', 'apt_budget'] },
    { label: 'Машиноместа', codes: ['4.8', '4.9'] },
  ],
  mortgage_subsidy: [
    { label: 'Объёмы выдач',            codes: ['6.36', 'subsidy-volume.html'] },
    { label: 'Характеристики кредитов', codes: [
      'subsidy-rate.html',
      'subsidy-term.html',
      'subsidy-loan-amount.html',
      'subsidy-ltv.html',
      'subsidy-property-price.html',
      'subsidy-area.html',
      'subsidy-price-per-sqm.html',
    ]},
    { label: 'Структура выдач',         codes: [
      'subsidy-purpose-structure.html',
      'subsidy-family-types.html',
    ]},
  ],
};

// ── Иконка для структурных комбо-карточек ────────────────────────────────────
const COMBO_ICON_SVG = `<svg class="combo-icon" width="16" height="16" viewBox="0 0 24 24"
  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
  <line x1="8" y1="6" x2="16" y2="6" opacity=".4"/>
</svg>`;

// ── Основная логика страницы ───────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const catCode = params.get('code') || 'mortgage_total';

// ── Форматирование: число отдельно, единица (с масштабом) отдельно ──────────
// Возвращает { num, effectiveUnit } — num идёт крупным шрифтом,
// effectiveUnit (с учётом млн/млрд) — рядом с периодом мелким.
function fmtValueSplit(v, unit, decimals) {
  if (v == null) return { num: '—', effectiveUnit: unit || '' };
  const n = Number(v);
  if (isNaN(n)) return { num: '—', effectiveUnit: unit || '' };
  const u = unit || '';
  const d = decimals ?? null;
  if (Math.abs(n) >= 1e9) return { num: fmtNum(n / 1e9, d ?? 2), effectiveUnit: ('млрд ' + u).trim() };
  if (Math.abs(n) >= 1e6) return { num: fmtNum(n / 1e6, d ?? 2), effectiveUnit: ('млн ' + u).trim() };
  if (Math.abs(n) >= 1e3) return { num: fmtNum(n, d ?? 0),       effectiveUnit: u };
  if (u.startsWith('млн'))return { num: fmtNum(n, d ?? 0),        effectiveUnit: u };
  return                         { num: fmtNum(n, d ?? 2),        effectiveUnit: u };
}

// ── Переключение серий ────────────────────────────────────────────────────
function cycleSeriesOnRow(row, series, cache) {
  let idx = parseInt(row.dataset.seriesIndex) || 0;
  idx = (idx + 1) % series.length;
  row.dataset.seriesIndex = idx;

  const s    = series[idx];
  const data = cache.get(s.code);
  if (!data) return;

  const pp = data.unit === '%';
  const decimalsOverride = row.dataset.seriesDecimals !== undefined ? Number(row.dataset.seriesDecimals) : null;
  const { num, effectiveUnit } = fmtValueSplit(data.value, data.unit, decimalsOverride);

  // Плавное обновление: fade-out → обновить → fade-in
  const targets = [
    row.querySelector('[data-field="value"]'),
    row.querySelector('[data-field="yoy"]'),
    row.querySelector('[data-field="spark"]'),
  ].filter(Boolean);

  targets.forEach(el => el.classList.add('field-fading'));

  setTimeout(() => {
    // Значение — только число, без единиц
    const valueEl = row.querySelector('[data-field="value"]');
    if (valueEl) valueEl.textContent = num;

    // Период + единица (с учётом масштаба)
    const periodEl = row.querySelector('[data-field="period"]');
    if (periodEl) {
      periodEl.textContent = (data.period || '') +
        (effectiveUnit ? ' · ' + effectiveUnit : '');
    }

    // YoY
    const yoyEl = row.querySelector('[data-field="yoy"]');
    if (yoyEl) yoyEl.innerHTML = deltaHtml(data.yoy, pp);

    // Метка серии
    const nameEl = row.querySelector('.series-name');
    if (nameEl) nameEl.textContent = s.label;

    // Точки
    row.querySelectorAll('.dot').forEach((dot, i) => {
      dot.classList.toggle('active', i === idx);
    });

    // Спарклайн
    const sparkEl = row.querySelector('[data-field="spark"]');
    if (sparkEl) {
      sparkEl.innerHTML = '';
      if (data.history?.length > 1) {
        drawSparkline(sparkEl, data.history, { width: 100, height: 36, color: '#E8341C' });
      }
    }

    targets.forEach(el => el.classList.remove('field-fading'));
  }, 80);
}

async function loadPage() {
  const HIDDEN_CATEGORIES = ['mortgage_total', 'mortgage_secondary'];
  const categories = (await api.categories()).filter(c => !HIDDEN_CATEGORIES.includes(c.code));

  // Заголовочная навигация
  const nav = document.getElementById('main-nav');
  nav.innerHTML = `
    <a href="category.html?code=mortgage_base" ${catCode==='mortgage_base'?'class="active"':''}>Ипотека</a>
    <a href="category.html?code=prices" ${catCode==='prices'?'class="active"':''}>Цены</a>
    <a href="category.html?code=demand" ${catCode==='demand'?'class="active"':''}>Спрос</a>
    <a href="category.html?code=supply_volume" ${catCode==='supply_volume'?'class="active"':''}>Ввод жилья</a>
    <a href="category.html?code=under_construction" ${catCode==='under_construction'?'class="active"':''}>Стройка</a>
    <a href="category.html?code=macro" ${catCode==='macro'?'class="active"':''}>Макро</a>
  `;

  // Боковая панель
  const sidebarLinks = document.getElementById('sidebar-links');
  sidebarLinks.innerHTML = categories.map(c =>
    `<a href="category.html?code=${c.code}" class="sidebar-link ${c.code === catCode ? 'active' : ''}">${c.name}</a>`
  ).join('');

  // Индикаторы категории
  const rawIndicators = await api.categoryIndicators(catCode);
  const indicators    = applyComboOverrides(catCode, rawIndicators);
  const cat = categories.find(c => c.code === catCode);

  document.title = `${cat?.name || catCode} — Рынок недвижимости`;
  document.getElementById('cat-name').textContent    = cat?.name || catCode;
  document.getElementById('page-heading').textContent = cat?.name || catCode;
  document.getElementById('page-sub').textContent =
    `${indicators.length} показателей`;

  // ── Batch-загрузка данных ─────────────────────────────────────────────────
  // ── Сбор кодов для batch-запроса ─────────────────────────────────────────
  // Вычисляемые серии (__pct:…) не запрашиваются в API — их числители и
  // знаменатели добавляются вместо них.
  const allBatchCodes = new Set();
  // derivedMeta: virtualCode → { numerator, denominator } — для пост-обработки
  const derivedMeta  = new Map();

  for (const ind of indicators) {
    if (ind._series?.length > 0) {
      for (const s of ind._series) {
        if (s._numerator) {
          // Вычисляемая серия: добавляем реальные коды-составляющие
          allBatchCodes.add(s._numerator);
          allBatchCodes.add(s._denominator);
          derivedMeta.set(s.code, { numerator: s._numerator, denominator: s._denominator });
        } else {
          allBatchCodes.add(s.code);
        }
      }
    } else if (!ind._isComboOnly && ind.code) {
      allBatchCodes.add(ind.code);
    }
    // sparkCode — только реальные коды (вычисляемые начинаются с '__')
    if (ind._sparkCode && !ind._sparkCode.startsWith('__')) {
      allBatchCodes.add(ind._sparkCode);
    }
  }

  // code → { value, yoy, unit, period, source, history[] }
  const seriesCache = new Map();
  if (allBatchCodes.size > 0) {
    try {
      // rangeStart(5): 5 лет — достаточно для ежемесячных (60 т.) и ежегодных (5 т.)
      const resp = await api.multiIndicatorData([...allBatchCodes].join(','), rangeStart(5));
      for (const code of allBatchCodes) {
        const entry = resp[code];
        if (!entry) continue;
        const points = entry.series || [];
        const last   = points.length ? points[points.length - 1] : null;
        seriesCache.set(code, {
          value:   last?.value          != null ? parseFloat(last.value)            : null,
          yoy:     last?.yoy_change_pct != null ? parseFloat(last.yoy_change_pct)   : null,
          unit:    entry.indicator?.unit               || '',
          period:  last?.label                         || '',
          source:  entry.indicator?.source?.name       || '',
          history: points.map(p => p.value != null ? parseFloat(p.value) : null),
          periods: points.map(p => p.label || ''),
        });
      }
    } catch (e) {
      console.error('Batch data load failed:', e);
    }
  }

  // ── Вычисление derived-серий (доли в %) ──────────────────────────────────
  for (const [vcode, { numerator, denominator }] of derivedMeta) {
    const numE = seriesCache.get(numerator);
    const denE = seriesCache.get(denominator);
    if (!numE || !denE) continue;

    // Поэлементное деление (массивы выровнены: одна категория, один период)
    const len = Math.min(numE.history.length, denE.history.length);
    const history = [];
    for (let i = 0; i < len; i++) {
      const n = numE.history[i], d = denE.history[i];
      history.push(n != null && d != null && d !== 0 ? n / d * 100 : null);
    }

    // Ищем последнюю позицию, где числитель ненулевой и знаменатель ненулевой
    let lastShare = null;
    let lastPeriod = numE.period;
    for (let i = Math.min(numE.history.length, denE.history.length) - 1; i >= 0; i--) {
      const n = numE.history[i], d = denE.history[i];
      if (n != null && n !== 0 && d != null && d !== 0) {
        lastShare = n / d * 100;
        lastPeriod = (numE.periods && numE.periods[i]) || lastPeriod;
        break;
      }
    }

    // YoY в п.п.: текущая доля − доля год назад (12 позиций назад для месячных)
    // Считаем от позиции lastShare, а не от конца массива
    let yoy = null;
    if (history.length >= 13) {
      // Найдём индекс lastShare в history
      let lastIdx = history.length - 1;
      while (lastIdx >= 0 && (history[lastIdx] == null || history[lastIdx] === 0)) lastIdx--;
      if (lastIdx >= 12) {
        const curr = history[lastIdx];
        const prev = history[lastIdx - 12];
        if (curr != null && prev != null) yoy = curr - prev;
      }
    }

    seriesCache.set(vcode, {
      value:   lastShare,
      yoy,
      unit:    '%',
      period:  lastPeriod,
      source:  numE.source,
      history,
    });
  }

  const list = document.getElementById('indicator-list');
  list.innerHTML = '';

  // ── Рендер одной строки индикатора ───────────────────────────────────────
  function renderRow(ind) {
    const isCombo   = !!(ind._comboUrl);
    const hasSeries = !!(ind._series?.length > 0);
    const href      = isCombo ? ind._comboUrl : `chart.html?code=${ind.code}`;
    const name      = isCombo ? ind._comboLabel : cleanName(ind.name);

    const row = document.createElement('div');
    row.className = 'indicator-row';

    if (hasSeries) {
      // ── Комбо с сериями: интерактивная строка ───────────────────────────
      const s0     = ind._series[0];
      const cache0 = seriesCache.get(s0.code) || {};
      const pp0    = cache0.unit === '%';

      const { num: num0, effectiveUnit: eu0 } = fmtValueSplit(cache0.value, cache0.unit, ind._decimals);
      const periodText0 = (cache0.period || '') + (eu0 ? ' · ' + eu0 : '');
      const dots = ind._series.map((_, i) =>
        `<span class="dot${i === 0 ? ' active' : ''}"></span>`
      ).join('');

      row.setAttribute('data-has-series', 'true');
      row.dataset.seriesIndex = '0';
      if (ind._decimals != null) row.dataset.seriesDecimals = ind._decimals;

      row.innerHTML = `
        <div class="indicator-name">
          <a href="${href}">${name}</a>
        </div>
        <div>
          <div class="indicator-value" data-field="value">${num0}</div>
          <div class="series-label">
            <span class="series-name" data-field="label">${s0.label}</span>
            <span class="series-dots">${dots}</span>
          </div>
          <div class="indicator-period" data-field="period">${periodText0}</div>
        </div>
        <div style="text-align:center"><span data-field="yoy">${deltaHtml(cache0.yoy, pp0)}</span></div>
        <div class="indicator-sparkline" data-field="spark"></div>
        <div style="font-size:.75rem;color:var(--color-muted);text-align:center">${cache0.source || '—'}</div>
      `;

      // Начальный спарклайн для series[0]
      const sparkEl = row.querySelector('[data-field="spark"]');
      if (cache0.history?.length > 1) {
        drawSparkline(sparkEl, cache0.history, { width: 100, height: 36, color: '#E8341C' });
      }

      // Клик по строке — переключить серию (клик по ссылке — не перехватывать)
      row.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        cycleSeriesOnRow(row, ind._series, seriesCache);
        e.preventDefault();
      });

    } else if (isCombo) {
      // ── Структурная / долевая комбо-строка: "Сравнительный анализ" ──────
      const sparkCode = ind._sparkCode;

      row.innerHTML = `
        <div class="indicator-name">
          <a href="${href}">${name}</a>
        </div>
        <div>
          <div class="combo-value">
            ${COMBO_ICON_SVG}
            <span style="font-size:.82rem;color:var(--color-muted)">Сравнительный&nbsp;анализ</span>
          </div>
        </div>
        <div style="text-align:center">
          <span class="combo-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            комбо
          </span>
        </div>
        <div class="indicator-sparkline"></div>
        <div style="font-size:.75rem;color:var(--color-muted);text-align:center">—</div>
      `;

      // Спарклайн из кэша (для _sparkCode)
      if (sparkCode) {
        const sparkEl  = row.querySelector('.indicator-sparkline');
        const history  = seriesCache.get(sparkCode)?.history;
        if (history?.length > 1) {
          drawSparkline(sparkEl, history, { width: 100, height: 36, color: '#E8341C' });
        }
      }

    } else {
      // ── Одиночный показатель ─────────────────────────────────────────────
      const pp    = ind.unit === '%';
      const cache = seriesCache.get(ind.code) || {};
      const source = cache.source || '—';

      const { num: numS, effectiveUnit: euS } = fmtValueSplit(ind.last_value, ind.unit);
      const periodTextS = (ind.last_period_label || '') + (euS ? ' · ' + euS : '');

      row.innerHTML = `
        <div class="indicator-name">
          <a href="${href}">${name}</a>
        </div>
        <div>
          <div class="indicator-value">${numS}</div>
          <div class="indicator-period">${periodTextS}</div>
        </div>
        <div style="text-align:center">${deltaHtml(ind.yoy_change_pct, pp)}</div>
        <div class="indicator-sparkline"></div>
        <div style="font-size:.75rem;color:var(--color-muted);text-align:center">${source}</div>
      `;

      // Спарклайн из кэша
      const sparkEl = row.querySelector('.indicator-sparkline');
      if (cache.history?.length > 1) {
        drawSparkline(sparkEl, cache.history, { width: 100, height: 36, color: '#E8341C' });
      }
    }

    return row;
  }

  // ── Рендер списка: с подразделами или плоский ────────────────────────────
  const subs = SUBSECTIONS[catCode];
  if (subs) {
    // Lookup: effectiveCode → ind
    // append-комбо (parentCode=null) идентифицируются по _comboUrl
    const byCode = {};
    for (const ind of indicators) {
      const key = ind._isComboOnly ? ind._comboUrl : ind.code;
      byCode[key] = ind;
    }
    for (const sub of subs) {
      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = sub.label;
      list.appendChild(header);
      for (const code of sub.codes) {
        const ind = byCode[code];
        if (ind) list.appendChild(renderRow(ind));
      }
    }
  } else {
    // Плоский рендер для категорий без подразделов
    for (const ind of indicators) {
      list.appendChild(renderRow(ind));
    }
  }
}

loadPage().catch(console.error);
</script>
</body>
</html>

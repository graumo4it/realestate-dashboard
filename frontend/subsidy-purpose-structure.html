<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Цели кредитования — Рынок недвижимости России</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/chart.css"/>
  <link rel="stylesheet" href="css/combo-page.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <style>
    .kpi-cards-row {
      display: grid;
      grid-template-columns: repeat(var(--kpi-count, 5), minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .kpi-cards-row .kpi-card-sm {
      min-width: 0;
      padding: 14px 18px;
    }
    .kpi-cards-row .kpi-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      align-self: start;
    }
    .kpi-cards-row .kpi-value {
      font-size: 1.2rem;
      margin-bottom: 2px;
    }
    .kpi-cards-row .kpi-period {
      font-size: .72rem;
      margin-bottom: 6px;
      white-space: nowrap;
    }
    .kpi-cards-row .kpi-deltas {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
      font-size: .75rem;
    }
    .kpi-cards-row .kpi-deltas > span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      white-space: nowrap;
      color: var(--color-ink-light);
      font-weight: 600;
    }
    .kpi-cards-row .kpi-deltas .delta {
      font-size: .78rem;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .kpi-cards-row .kpi-deltas .delta-placeholder {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: .78rem;
      font-weight: 600;
    }
    @media (max-width: 1280px) { .kpi-cards-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 720px) { .kpi-cards-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .program-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: -8px 0 24px;
    }
    .program-tab {
      appearance: none;
      padding: 7px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      color: var(--color-muted);
      font-family: var(--font-body);
      font-size: .8rem;
      font-weight: 500;
      background: var(--color-surface);
      cursor: pointer;
      transition: all .15s;
    }
    .program-tab:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .program-tab.active {
      background: var(--color-ink);
      border-color: var(--color-ink);
      color: #fff;
    }
    @media (max-width: 680px) {
      .filter-bar-btn { min-width: 100%; }
      .toolbar-actions { width: 100%; }
      .toolbar-actions .btn-outline { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo"><span>MACON</span> DATA</a>
    <div class="header-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Поиск показателей…"/>
    </div>
  </div>
</header>
<main class="page-main">
  <div class="page-wrap">
    <div class="chart-layout">
      <div class="chart-main">
        <div class="breadcrumb">
          <a href="index.html">Главная</a><span class="breadcrumb-sep">›</span>
          <a href="category.html?code=mortgage_subsidy">Ипотека (льготные программы)</a><span class="breadcrumb-sep">›</span>
          <span id="breadcrumb-current">Цели кредитования</span>
        </div>

        <div class="chart-header">
          <h1 id="page-title">Цели кредитования</h1>
          <div class="chart-meta">
            <span class="chart-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>ДОМ.РФ</span>
            <span class="chart-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="chart-period-type"></span></span>
          </div>
        </div>

        <div class="program-tabs" id="program-nav"></div>

        <div class="kpi-cards-row" id="kpi-row"></div>

        <div class="filter-bar" id="filter-bar">
          <div class="filter-bar-btn" id="btn-filter-series">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            Цель кредита
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            <div class="filter-dropdown" id="series-dropdown" style="display:none"></div>
          </div>
          <button class="filter-bar-reset" id="btn-reset-filters">Сбросить</button>
        </div>

        <div class="chart-toolbar">
          <div id="toolbar-controls" style="display:flex;gap:8px;flex-wrap:wrap"></div>
          <div class="toolbar-actions">
            <button class="btn-outline" id="btn-download-png"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button>
            <button class="btn-outline" id="btn-download-xlsx"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Excel</button>
          </div>
        </div>

        <div class="chart-container">
          <div id="main-chart"></div>
          <div class="chart-source">Источник: ДОМ.РФ</div>
        </div>

        <div class="data-table-wrap">
          <div class="data-table-header"><span>Исходные данные</span></div>
          <div class="table-tabs" id="table-tabs"></div>
          <table class="data-table">
            <thead><tr>
              <th style="width:25%">Период</th>
              <th style="width:25%;text-align:right">Значение, шт.</th>
              <th style="width:25%;text-align:right">Изм. г/г</th>
              <th style="width:25%;text-align:right">Изм. м/м</th>
            </tr></thead>
            <tbody id="data-table-body"><tr><td colspan="4" class="skeleton" style="height:160px"></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer"><div>Данные: ДОМ.РФ &nbsp;·&nbsp; Не является инвестиционной рекомендацией</div></footer>
<script>window.API_BASE = 'http://localhost:8001/api';</script>
<script src="js/api.js"></script>
<script src="js/utils.js?v=10"></script>
<script src="js/period-toggle.js?v=4"></script>
<script src="js/subsidy-purpose-page.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>График — Рынок недвижимости России</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/chart.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <style>
    .chart-layout { display: block; }
    .chart-main { max-width: 100%; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo">Рынок<span>.</span>Данные</a>
    <nav class="header-nav" id="main-nav">
      <a href="category.html?code=mortgage_base">Ипотека</a>
      <a href="category.html?code=prices">Цены</a>
      <a href="category.html?code=demand">Спрос</a>
      <a href="category.html?code=supply_volume">Ввод жилья</a>
      <a href="category.html?code=under_construction">Стройка</a>
      <a href="category.html?code=macro">Макро</a>
    </nav>
    <div class="header-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input id="search-input" type="text" placeholder="Поиск показателей…"/>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="page-wrap">
    <div class="chart-layout">
      <div class="chart-main">

        <div class="breadcrumb">
          <a href="index.html">Главная</a>
          <span class="breadcrumb-sep">›</span>
          <a href="#" id="breadcrumb-cat">—</a>
          <span class="breadcrumb-sep">›</span>
          <span id="breadcrumb-code"></span>
        </div>

        <div class="chart-header">
          <h1 id="chart-title"><span class="skeleton" style="display:inline-block;width:500px;height:2rem;border-radius:4px"></span></h1>
          <div class="chart-meta">
            <span class="chart-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span id="chart-updated">—</span>
            </span>
            <span class="chart-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span id="chart-source-name">—</span>
            </span>
            <span class="chart-meta-item" style="color:var(--color-muted)" id="chart-unit"></span>
          </div>
        </div>

        <div class="kpi-row">
          <div class="kpi-card kpi-card--main">
            <div class="kpi-card-inner">
              <div>
                <div class="kpi-label">Последнее значение</div>
                <div class="kpi-value" id="kpi-last-value">—</div>
                <div class="kpi-unit" id="kpi-last-unit"></div>
              </div>
              <div class="kpi-divider"></div>
              <div>
                <div class="kpi-label">Период</div>
                <div class="kpi-period-value" id="kpi-last-period">—</div>
              </div>
            </div>
            <div class="kpi-delta" id="kpi-delta"></div>
          </div>
        </div>

        <div class="chart-toolbar">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <div class="btn-group" role="group">
              <button data-range="1">1 год</button>
              <button data-range="3">3 года</button>
              <button data-range="5">5 лет</button>
              <button data-range="all" class="active">За все время</button>
            </div>
            <div class="btn-group" role="group">
              <button data-mode="absolute" class="active">Значения</button>
              <button data-mode="yoy">Изм. г/г</button>
              <button data-mode="mom">Изм. м/м</button>
            </div>
          </div>
          <div class="toolbar-actions">
            <button class="btn-outline" id="btn-download-png">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              PNG
            </button>
            <button class="btn-outline" id="btn-download-xlsx">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Excel
            </button>
          </div>
        </div>

        <div class="chart-container">
          <div id="main-chart"></div>
          <div class="chart-source">Источник: <span id="chart-source-name2"></span></div>
        </div>

        <div class="data-table-wrap">
          <div class="data-table-header"><span>Исходные данные</span></div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Период</th>
                <th style="text-align:right">Значение</th>
                <th style="text-align:right">ИЗМ. Г/Г</th>
                <th style="text-align:right">ИЗМ. М/М</th>
              </tr>
            </thead>
            <tbody id="data-table-body">
              <tr><td colspan="4" class="skeleton" style="height:180px"></td></tr>
            </tbody>
          </table>
        </div>

        <div>
          <div class="section-title">Еще по теме</div>
          <div class="related-grid" id="related-grid"></div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div>Данные: Банк России, Росстат, ДОМ.РФ, Домклик, Росреестр, ЕМИСС &nbsp;·&nbsp;
  Не является инвестиционной рекомендацией</div>
</footer>

<script>window.API_BASE = 'http://localhost:8001/api';</script>
<script src="js/api.js"></script>
<script src="js/utils.js?v=10"></script>
<script src="js/sparkline.js"></script>
<script>
api.categories().then(() => {}).catch(() => {});

const srcName  = document.getElementById('chart-source-name');
const srcName2 = document.getElementById('chart-source-name2');
const observer = new MutationObserver(() => { if (srcName2) srcName2.textContent = srcName.textContent; });
if (srcName) observer.observe(srcName, { childList: true, characterData: true, subtree: true });
</script>
<script src="js/period-toggle.js?v=4"></script>
<script src="js/chart-page.js?v=5"></script>
</body>
</html>

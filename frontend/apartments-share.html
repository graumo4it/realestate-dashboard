<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Квартирография: структура — Рынок недвижимости России</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/chart.css"/>
  <link rel="stylesheet" href="css/combo-page.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <style>
    /* Отключаем сайдбарный grid */
    .chart-layout { display: block; }
    .chart-main { max-width: 100%; }

    .kpi-cards-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
    .kpi-card-sm {
      background:var(--color-surface); border:1px solid var(--color-border);
      border-radius:var(--radius-lg); padding:14px 16px; box-shadow:var(--shadow);
    }
    .kpi-card-sm .kpi-label {
      font-size:.7rem; color:var(--color-muted); text-transform:uppercase;
      letter-spacing:.08em; margin-bottom:4px; display:flex; align-items:center; gap:6px;
    }
    .kpi-card-sm .kpi-value {
      font-family:var(--font-mono); font-size:1.1rem; font-weight:700;
      color:var(--color-ink); line-height:1; margin-bottom:2px;
    }
    .kpi-card-sm .kpi-period { font-size:.7rem; color:var(--color-muted); margin-bottom:6px; }
    .kpi-card-sm .kpi-deltas { display:flex; gap:6px; flex-wrap:wrap; font-size:.75rem; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo"><span>MACON</span> DATA</a>
    <div class="header-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Поиск показателей…"/>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="page-wrap">
    <div class="chart-layout">
      <div class="chart-main">
        <div class="breadcrumb">
          <a href="index.html">Главная</a><span class="breadcrumb-sep">›</span>
          <a href="category.html?code=apartments">Квартирография</a><span class="breadcrumb-sep">›</span>
          <span>Структура</span>
        </div>

        <div class="chart-header">
          <h1>Квартирография возводимого жилья: структура по комнатности</h1>
          <div class="chart-meta">
            <span class="chart-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              ДОМ.РФ
            </span>
            <span class="chart-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="chart-period-type"></span></span>
          </div>
        </div>

        <!-- KPI: 4 типа — доли на последнюю дату -->
        <div class="kpi-cards-row">
          <div class="kpi-card-sm">
            <div class="kpi-label"><span class="kpi-dot" style="background:#BEDBE4"></span>1-комнатные</div>
            <div class="kpi-value" id="kpi-1k-value">—</div>
            <div class="kpi-period" id="kpi-1k-period">—</div>
            <div class="kpi-deltas" id="kpi-1k-deltas"></div>
          </div>
          <div class="kpi-card-sm">
            <div class="kpi-label"><span class="kpi-dot" style="background:#C8181A"></span>2-комнатные</div>
            <div class="kpi-value" id="kpi-2k-value">—</div>
            <div class="kpi-period" id="kpi-2k-period">—</div>
            <div class="kpi-deltas" id="kpi-2k-deltas"></div>
          </div>
          <div class="kpi-card-sm">
            <div class="kpi-label"><span class="kpi-dot" style="background:#4C707A"></span>3-комнатные</div>
            <div class="kpi-value" id="kpi-3k-value">—</div>
            <div class="kpi-period" id="kpi-3k-period">—</div>
            <div class="kpi-deltas" id="kpi-3k-deltas"></div>
          </div>
          <div class="kpi-card-sm">
            <div class="kpi-label"><span class="kpi-dot" style="background:#0E7C56"></span>4+ комнатные</div>
            <div class="kpi-value" id="kpi-4k-value">—</div>
            <div class="kpi-period" id="kpi-4k-period">—</div>
            <div class="kpi-deltas" id="kpi-4k-deltas"></div>
          </div>
        </div>

        <!-- Горизонтальная панель фильтров -->
        <div class="filter-bar" id="filter-bar">
          <div class="filter-bar-btn" id="btn-filter-series" style="position:relative">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
            Тип индикатора
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            <div class="filter-dropdown" id="series-dropdown" style="display:none"></div>
          </div>
          <button class="filter-bar-reset" id="btn-reset-filters">Сбросить</button>
        </div>

        <div class="chart-toolbar">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <div class="btn-group">
              <button data-range="1">1 год</button>
              <button data-range="3">3 года</button>
              <button data-range="5">5 лет</button>
              <button data-range="all" class="active">За все время</button>
            </div>
            <div class="btn-group">
              <button data-mode="absolute" class="active">Структура, %</button>
              <button data-mode="yoy">Изм. г/г, п.п.</button>
              <button data-mode="mom">Изм. м/м, п.п.</button>
            </div>
          </div>
          <div class="toolbar-actions">
            <button class="btn-outline" id="btn-download-png"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> PNG</button>
            <button class="btn-outline" id="btn-download-xlsx"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Excel</button>
          </div>
        </div>

        <div class="chart-container">
          <div id="main-chart"></div>
          <div class="chart-source">Источник: ДОМ.РФ</div>
        </div>

        <!-- Таблица -->
        <div class="data-table-wrap">
          <div class="data-table-header"><span>Исходные данные</span></div>
          <div class="table-tabs">
            <button class="table-tab active" data-table="1k">1-комнатные</button>
            <button class="table-tab" data-table="2k">2-комнатные</button>
            <button class="table-tab" data-table="3k">3-комнатные</button>
            <button class="table-tab" data-table="4k">4+ комнатные</button>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:25%">Период</th>
                <th style="width:25%;text-align:right">Доля, %</th>
                <th style="width:25%;text-align:right">Изм. г/г, п.п.</th>
                <th style="width:25%;text-align:right">Изм. м/м, п.п.</th>
              </tr>
            </thead>
            <tbody id="data-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div>Данные: ДОМ.РФ</div>
</footer>

<script>window.API_BASE = 'http://localhost:8001/api';</script>
<script src="js/api.js"></script>
<script src="js/utils.js?v=10"></script>
<script src="js/period-toggle.js"></script>
<script src="js/combo-page.js?v=6"></script>
<script>
const _CODES_MAP = {
  '1k': 'apartments_share_1k',
  '2k': 'apartments_share_2k',
  '3k': 'apartments_share_3k',
  '4k': 'apartments_share_4k',
};

ComboPage.init({
  codes:    { '1k': 'apartments_share_1k', '2k': 'apartments_share_2k',
              '3k': 'apartments_share_3k', '4k': 'apartments_share_4k' },
  labels:   { '1k': '1-комнатные', '2k': '2-комнатные', '3k': '3-комнатные', '4k': '4+ комнатные' },
  keys:     ['1k', '2k', '3k', '4k'],
  colors:   { '1k': '#BEDBE4', '2k': '#C8181A', '3k': '#4C707A', '4k': '#0E7C56' },
  chartType:  'bar',
  stack100:   true,
  isPp:       true,
  decimals:   1,
  unit:       '%',
  fileName:   'apartments-share',
  onTableHeader: () => 'Доля, %',

  onData(allData) {
    ['1k', '2k', '3k', '4k'].forEach(k => {
      const s    = (allData[_CODES_MAP[k]]?.series || []).filter(p => p.value != null);
      const last = s[s.length - 1];
      if (!last) return;
      document.getElementById(`kpi-${k}-value`).textContent  = fmtNum(Number(last.value), 1) + '%';
      document.getElementById(`kpi-${k}-period`).textContent = last.label || '—';
      document.getElementById(`kpi-${k}-deltas`).innerHTML =
        `<span>г/г: ${deltaHtml(last.yoy_change_pct, true)}</span>` +
        `<span>м/м: ${deltaHtml(last.mom_change_pct, true)}</span>`;
    });
  },
}).catch(console.error);
</script>
</body>
</html>
